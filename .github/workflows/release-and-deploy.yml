name: Release and Deploy Morpheus

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  open-gate:
    name: Abrir gate de validación
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Resolver el elegido y abrir el Issue-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          PR_INFO=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0]')
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
          ELEGIDO=$(echo "$PR_INFO" | jq -r '.user.login // empty')

          if [ -z "$ELEGIDO" ]; then
            ELEGIDO="${{ github.actor }}"
          fi

          TITLE="Despliegue de ${SHA:0:7}${PR_NUMBER:+ (PR #$PR_NUMBER)} — ventana de validación"
          BODY=$(cat <<EOF
          Despierta, $ELEGIDO.

          Tu PR${PR_NUMBER:+ #$PR_NUMBER} se acaba de desplegar en producción.

          - Commit: $SHA
          - URL: ${PAGE_URL:-(ver el job de deploy)}

          Tienes una ventana de validación para decidir:
          - Comenta \`ok\` (pastilla roja) para liberar la cola.
          - Comenta \`stop\` (pastilla azul) para disparar el revert.
          - Comenta \`pause\` (bullet time) para congelar la cola sin revert.

          Si no respondes a tiempo, se aplicará el modo configurado (default-ok / prudente).
          EOF
          )

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee "$ELEGIDO" \
            --label "gate:pending"
