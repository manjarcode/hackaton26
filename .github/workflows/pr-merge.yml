name: Merge

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  hotfix:
    name: Hotfix (salta al frente de la cola)
    if: github.event.label.name == 'hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar al gatekeeper con prioridad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Operador, necesito una salida: PR #$PR_NUMBER pasa al frente de la cola."
          echo "Sigue pasando por el gatekeeper (monolith-deploy-queue.yml) y respeta el gate — solo tiene prioridad sobre las automerge, no bypass total."
          gh workflow run monolith-deploy-queue.yml --repo "$REPO"

  enqueue:
    name: Encolar para la subida
    if: github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar al gatekeeper de la subida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #$PR_NUMBER encolada para la subida al monolito."
          echo "El gatekeeper (monolith-deploy-queue.yml) decide cuándo mergearla — esta PR no espera activamente."
          gh workflow run monolith-deploy-queue.yml --repo "$REPO"
