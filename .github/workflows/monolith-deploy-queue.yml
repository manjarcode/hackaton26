name: Subida al monolito (gatekeeper)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: monolith-deploy-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gatekeeper:
    name: Decidir la siguiente subida
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el gate y mergear la siguiente PR de la cola
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TIMEOUT_MINUTES: ${{ vars.GATE_TIMEOUT_MINUTES || 10 }}
          TIMEOUT_MODE: ${{ vars.GATE_TIMEOUT_MODE || 'default-ok' }}
        run: |
          BLOCKED=$(gh issue list --repo "$REPO" --state open --label "queue:blocked" --json number \
            --jq 'first.number // empty')

          if [ -n "$BLOCKED" ]; then
            SUMMARY="Cola detenida manualmente: issue #$BLOCKED (queue:blocked) abierto. No se evalúa ni mergea nada hasta que un humano lo resuelva y lo cierre."
            echo "::notice::$SUMMARY"
            echo "## $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          GATE=$(gh issue list --repo "$REPO" --state open --json number,title,assignees,labels,createdAt \
            --jq '[.[] | select(any(.labels[]; .name | startswith("gate:")))] | sort_by(.number) | last')

          GATE_NUMBER=$(echo "$GATE" | jq -r '.number // empty')

          if [ -n "$GATE_NUMBER" ]; then
            LABEL=$(echo "$GATE" | jq -r '[.labels[].name | select(startswith("gate:"))][0]')
            ASSIGNEE=$(echo "$GATE" | jq -r '.assignees[0].login // "sin asignar"')
            TITLE=$(echo "$GATE" | jq -r '.title')
            CREATED_AT=$(echo "$GATE" | jq -r '.createdAt')

            if [ "$LABEL" = "gate:pending" ]; then
              CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s)
              NOW_EPOCH=$(date +%s)
              ELAPSED_MIN=$(( (NOW_EPOCH - CREATED_EPOCH) / 60 ))

              if [ "$ELAPSED_MIN" -ge "$TIMEOUT_MINUTES" ]; then
                if [ "$TIMEOUT_MODE" = "default-ok" ]; then
                  gh issue edit "$GATE_NUMBER" --repo "$REPO" \
                    --remove-label "gate:pending" --add-label "gate:ok"
                  gh issue close "$GATE_NUMBER" --repo "$REPO" \
                    --comment "Timeout de ${TIMEOUT_MINUTES} min alcanzado en modo \`default-ok\` — pastilla roja automática. Cola liberada."
                  echo "## Gate #$GATE_NUMBER: timeout alcanzado en modo default-ok, forzado a gate:ok." >> "$GITHUB_STEP_SUMMARY"
                  LABEL="gate:ok"
                else
                  SUMMARY="Gate #$GATE_NUMBER lleva ${ELAPSED_MIN}min en gate:pending (timeout ${TIMEOUT_MINUTES}min superado), asignado a @$ASSIGNEE — modo prudente, requiere resolución manual explícita."
                  echo "::notice::$SUMMARY"
                  echo "## $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            fi

            if [ "$LABEL" != "gate:ok" ]; then
              SUMMARY="Bloqueado por el gate #$GATE_NUMBER ($LABEL), asignado a @$ASSIGNEE — \"$TITLE\". No se mergea nada hasta que se resuelva."
              echo "::notice::$SUMMARY"
              echo "## $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          CANDIDATE=$(gh pr list --repo "$REPO" --base main --state open --label hotfix --json number \
            --jq 'sort_by(.number) | first.number // empty')

          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(gh pr list --repo "$REPO" --base main --state open --label automerge --json number \
              --jq 'sort_by(.number) | first.number // empty')
          fi

          if [ -z "$CANDIDATE" ]; then
            echo "## Cola vacía, nada que mergear." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Mergeando PR #$CANDIDATE (siguiente en la cola, gate libre)." >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr merge "$CANDIDATE" --repo "$REPO" --merge --auto; then
            gh issue create --repo "$REPO" \
              --title "Cola bloqueada: fallo al mergear PR #$CANDIDATE" \
              --label "queue:blocked" \
              --body "El gatekeeper no ha podido mergear la PR #$CANDIDATE (puede que ya estuviera mergeada o tenga conflictos). La rotación automática queda detenida — no se intentará la siguiente de la cola. Un humano debe coordinarse, mergear a mano la PR que esté lista, y cerrar este issue para reanudar al gatekeeper."
            echo "::error::No se pudo mergear la PR #$CANDIDATE. Cola bloqueada, requiere intervención manual (ver issue creado)."
            exit 1
          fi
