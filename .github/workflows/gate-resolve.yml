name: Resolver gate de validación

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write

jobs:
  resolve-gate:
    name: Resolver gate
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Interpretar el comentario del elegido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ASSIGNEE: ${{ github.event.issue.assignees[0].login }}
          BODY: ${{ github.event.comment.body }}
          CURRENT_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if [ "$ISSUE_STATE" != "open" ]; then
            echo "Issue #$ISSUE_NUMBER no está abierto, se ignora el comentario."
            exit 0
          fi

          CURRENT_LABEL=$(echo "$CURRENT_LABELS_JSON" | jq -r '.[] | select(startswith("gate:"))' | head -1)
          if [ -z "$CURRENT_LABEL" ]; then
            echo "Issue #$ISSUE_NUMBER no tiene label gate:*, no es un gate. Se ignora."
            exit 0
          fi

          if [ -z "$ASSIGNEE" ] || [ "$COMMENTER" != "$ASSIGNEE" ]; then
            echo "Comentario de '$COMMENTER' en el gate #$ISSUE_NUMBER ignorado: solo el elegido ('$ASSIGNEE') puede resolverlo."
            exit 0
          fi

          WORD=$(echo "$BODY" | tr -d '\r' | awk '{print tolower($1)}')

          case "$WORD" in
            ok)
              NEW_LABEL="gate:ok"
              ;;
            stop)
              NEW_LABEL="gate:stop"
              ;;
            pause)
              NEW_LABEL="gate:paused"
              ;;
            *)
              echo "Comentario de '$COMMENTER' en el gate #$ISSUE_NUMBER no reconocido ('$WORD'). Se ignora. Usa ok / stop / pause."
              exit 0
              ;;
          esac

          if [ "$NEW_LABEL" = "$CURRENT_LABEL" ]; then
            echo "Gate #$ISSUE_NUMBER ya está en $NEW_LABEL, no hay cambio."
            exit 0
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "$CURRENT_LABEL" --add-label "$NEW_LABEL"

          case "$NEW_LABEL" in
            gate:ok)
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" \
                --comment "Pastilla roja. $COMMENTER confirma que todo va bien, la cola queda liberada."
              gh workflow run monolith-deploy-queue.yml --repo "$REPO"
              ;;
            gate:stop)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "Pastilla azul. $COMMENTER señala un fallo: la cola queda bloqueada, hace falta un revert manual en el monolito y cerrar este issue a mano cuando esté resuelto."
              ;;
            gate:paused)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "Bullet time. $COMMENTER pausa la ventana de validación. Comenta \`ok\` o \`stop\` cuando quieras resolverla."
              ;;
          esac

          echo "Gate #$ISSUE_NUMBER: $CURRENT_LABEL -> $NEW_LABEL"
